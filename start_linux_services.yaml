---
- name: Start previously stopped services on Linux servers
  hosts: linux_hosts
  gather_facts: false
  become: true

  tasks:

    - name: Validate Service List Received from Previous Workflow Job
      ansible.builtin.assert:
        that:
          - services_to_stop is defined
          - services_to_stop | length > 0
        fail_msg: >-
          No service list was received from the previous workflow job.
        success_msg: >-
          Received service list successfully:
          {{ services_to_stop }}

    - name: Start Services Received From Previous Workflow Job
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: started
      loop: "{{ services_to_stop }}"
      register: service_start_results

    - name: Gather Service Facts After Starting Services
      ansible.builtin.service_facts:

    - name: Validate Services are Running
      ansible.builtin.assert:
        that:
          - item in ansible_facts.services
          - ansible_facts.services[item].state == 'running'
        fail_msg: >-
          Service '{{ item }}' failed to start on
          {{ inventory_hostname }}.
          Current state:
          {{ ansible_facts.services[item].state | default('UNKNOWN') }}
        success_msg: >-
          Service '{{ item }}' is running successfully on
          {{ inventory_hostname }}.
      loop: "{{ services_to_stop }}"

    - name: Capture Service Up Time
      ansible.builtin.set_stats:
        data:
          service_up_time: "{{ lookup('pipe', 'TZ=Asia/Colombo date +%Y-%m-%dT%H:%M:%S%z') }}"
        per_host: false

    - name: Display Service Start Result
      ansible.builtin.debug:
        msg:
          - "Host: {{ inventory_hostname }}"
          - "Services started: {{ services_to_stop }}"
          - "Service start validation completed successfully."
