---
- name: Generate and send DR audit report
  hosts: localhost
  gather_facts: false

  tasks:

    - name: Display DR audit information
      ansible.builtin.debug:
        msg:
          - "Consistency Group : {{ consistency_group_name }}"
          - "Service Stopped   : {{ service_stop_time }}"
          - "Failover Started  : {{ failover_start_time }}"
          - "Failover Completed: {{ failover_end_time }}"
          - "Service UP        : {{ service_up_time }}"

    - name: Send DR audit report by email
      community.general.mail:
        host: "{{ smtp_host }}"
        port: "{{ smtp_port | default(25) }}"
        from: "{{ email_sender }}"
        to:
          - "{{ email_recipient }}"
        subject: "DR Failover Audit Report - {{ consistency_group_name }}"
        body: |
          ============================================================
                     DR FAILOVER AUDIT REPORT
          ============================================================

          Consistency Group       : {{ consistency_group_name }}

          ------------------------------------------------------------
          SERVICE STOP INFORMATION
          ------------------------------------------------------------

          Service Stopped         : {{ service_stop_time }}

          ------------------------------------------------------------
          RP4VM FAILOVER INFORMATION
          ------------------------------------------------------------

          Failover Started        : {{ failover_start_time }}
          Failover Completed      : {{ failover_end_time }}

          ------------------------------------------------------------
          SERVICE START INFORMATION
          ------------------------------------------------------------

          Service UP              : {{ service_up_time }}

          ------------------------------------------------------------

          DR workflow completed successfully.

          ============================================================
          Generated by Red Hat Ansible Automation Platform
          ============================================================
      delegate_to: localhost
