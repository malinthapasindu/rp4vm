---
- name: Validate recovered Windows VMs
  hosts: win_hosts
  gather_facts: false

  tasks:

    - name: Monitor Windows VM until WinRM is ready
      ansible.windows.win_ping:
      register: windows_ping_result
      until:
        - windows_ping_result.ping is defined
        - windows_ping_result.ping == 'pong'
      retries: 60
      delay: 10

    - name: Display Windows connectivity result
      ansible.builtin.debug:
        msg:
          - "VM: {{ inventory_hostname }}"
          - "IP: {{ ansible_host }}"
          - "Windows connectivity: SUCCESSFUL"
          - "WinRM response: {{ windows_ping_result.ping }}"
