---
- name: Validate recovered Windows VMs
  hosts: dr_windows
  gather_facts: false

  tasks:

    - name: Wait until Windows WinRM is available
      ansible.builtin.wait_for_connection:
        timeout: 600
        sleep: 10
        connect_timeout: 5

    - name: Validate Windows management connectivity
      ansible.windows.win_ping:
      register: windows_ping_result

    - name: Display Windows connectivity result
      ansible.builtin.debug:
        msg:
          - "VM: {{ inventory_hostname }}"
          - "IP: {{ ansible_host }}"
          - "Windows connectivity: SUCCESSFUL"
          - "WinRM response: {{ windows_ping_result.ping }}"
