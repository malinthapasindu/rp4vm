---
- name: Validate DC vCenter connectivity and authentication
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Validate vCenter credential variables
      ansible.builtin.assert:
        that:
          - vcenter_host is defined
          - vcenter_host | length > 0
          - vcenter_username is defined
          - vcenter_username | length > 0
          - vcenter_password is defined
          - vcenter_password | length > 0
        fail_msg: >-
          vCenter credential variables are missing.
          Attach the DC vCenter credential to the Job Template.
      no_log: true

    - name: Test ping connectivity to vCenter
      ansible.builtin.command:
        cmd: "ping -c 4 -W 2 {{ vcenter_host }}"
      register: vcenter_ping
      changed_when: false
      failed_when: false

    - name: Display ping connectivity result
      ansible.builtin.debug:
        msg: >-
          Ping connectivity to {{ vcenter_host }}:
          {{ 'SUCCESS' if vcenter_ping.rc == 0 else 'FAILED' }}

    - name: Fail when ping connectivity is unavailable
      ansible.builtin.fail:
        msg: >-
          Ping to vCenter {{ vcenter_host }} failed.
          Check DNS, routing, firewall, or ICMP settings.
      when: vcenter_ping.rc != 0

    - name: Authenticate to vCenter REST API
      ansible.builtin.uri:
        url: >-
          https://{{ vcenter_host }}:
          {{ vcenter_port | default('443') }}/api/session
        method: POST
        user: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        force_basic_auth: true
        validate_certs: "{{ validate_certs | default(false) | bool }}"
        return_content: true
        status_code: 201
      register: vcenter_session
      no_log: true

    - name: Display authentication result
      ansible.builtin.debug:
        msg:
          - "Ping connectivity: SUCCESS"
          - "vCenter authentication: SUCCESS"
          - "vCenter address: {{ vcenter_host }}"
          - "vCenter API port: {{ vcenter_port | default('443') }}"

    - name: Delete the temporary vCenter API session
      ansible.builtin.uri:
        url: >-
          https://{{ vcenter_host }}:
          {{ vcenter_port | default('443') }}/api/session
        method: DELETE
        headers:
          vmware-api-session-id: "{{ vcenter_session.json }}"
        validate_certs: "{{ validate_certs | default(false) | bool }}"
        status_code:
          - 200
          - 204
      no_log: true
