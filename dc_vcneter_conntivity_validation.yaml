---
- name: Validate DC vCenter connectivity and authentication
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Validate vCenter credential variables
      ansible.builtin.assert:
        that:
          - vcenter_host is defined
          - vcenter_host | length > 0
          - vcenter_username is defined
          - vcenter_username | length > 0
          - vcenter_password is defined
          - vcenter_password | length > 0
        fail_msg: >-
          vCenter credential variables are missing.
          Attach the 'DC vCenter' credential to the AAP Job Template.
      no_log: true

    - name: Ping the DC vCenter
      ansible.builtin.command:
        cmd: "ping -c 4 -W 2 {{ vcenter_host }}"
      register: vcenter_ping
      changed_when: false
      failed_when: false

    - name: Display ping result
      ansible.builtin.debug:
        msg: >-
          DC vCenter ping connectivity:
          {{ 'SUCCESS' if vcenter_ping.rc == 0 else 'FAILED' }}

    - name: Stop when ping fails
      ansible.builtin.fail:
        msg: >-
          Ping to DC vCenter {{ vcenter_host }} failed.
          Check DNS, routing, firewall, or whether ICMP is disabled.
      when: vcenter_ping.rc != 0

    - name: Validate vCenter authentication
      community.vmware.vmware_about_info:
        hostname: "{{ vcenter_host }}"
        port: "{{ vcenter_port | default('443') | int }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: "{{ validate_certs | default(false) | bool }}"
      register: vcenter_auth
      no_log: true

    - name: Display authentication result
      ansible.builtin.debug:
        msg:
          - "DC vCenter ping connectivity: SUCCESS"
          - "DC vCenter authentication: SUCCESS"
          - "vCenter: {{ vcenter_host }}"
          - "Version: {{ vcenter_auth.about_info.version | default('Unknown') }}"
